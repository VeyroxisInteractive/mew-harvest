name: Build signed Android release

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "prepare_android.py"
      - "android-updates.js"
      - ".github/workflows/android-release.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Increase for every update: 100, 101, 102'
        required: true
        default: '124'
      version_name:
        description: 'Display version: 1.0.0, 1.0.1'
        required: true
        default: '1.2.4'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      VERSION_CODE: ${{ inputs.version_code || '124' }}
      VERSION_NAME: ${{ inputs.version_name || '1.2.4' }}

    steps:
      - uses: actions/checkout@v4

      - name: Check version and signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import os,re,base64,pathlib
          code=os.environ['VERSION_CODE']
          name=os.environ['VERSION_NAME']
          assert re.fullmatch(r'[1-9][0-9]{0,9}',code) and int(code)<=2100000000,'Invalid version code'
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+',name),'Use version format 1.0.0'
          assert os.environ['KEYSTORE_BASE64'] and os.environ['KEYSTORE_PASSWORD'],'Add both Android signing secrets first'
          target=pathlib.Path(os.environ['RUNNER_TEMP'])/'mew-release.jks'
          target.write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64'],validate=True))
          target.chmod(0o600)
          PY

          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate > "$RUNNER_TEMP/releases.json"

          python3 - <<'PY'
          import json,os,pathlib,re
          text=(pathlib.Path(os.environ['RUNNER_TEMP'])/'releases.json').read_text()
          decoder=json.JSONDecoder()
          items=[]
          while text.strip():
              page,end=decoder.raw_decode(text.lstrip())
              items.extend(page)
              text=text.lstrip()[end:]
          codes=[int(r['tag_name'][8:]) for r in items if re.fullmatch(r'android-[0-9]+',r.get('tag_name',''))]
          assert not codes or int(os.environ['VERSION_CODE'])>max(codes),'Increase version_code above previous releases and drafts'
          PY

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Package latest game
        run: python3 prepare_android.py

      - name: Build signed APK and bundle
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/mew-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          gradle -p android assembleRelease bundleRelease lintRelease --no-daemon
          mkdir -p release-output
          cp android/app/build/outputs/apk/release/app-release.apk release-output/MEW-HARVEST.apk
          cp android/app/build/outputs/bundle/release/app-release.aab release-output/MEW-HARVEST.aab
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose release-output/MEW-HARVEST.apk
          sha256sum release-output/MEW-HARVEST.apk > release-output/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: MEW-HARVEST-SIGNED-RELEASE
          path: release-output/*
          retention-days: 7
          if-no-files-found: error

      - name: Prepare draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          Update improvements and fixes.

          Download MEW-HARVEST.apk for Android. Open the downloaded APK to install.
          Existing release users: install over the previous release without uninstalling to retain local progress.
          Website and old Test app saves do not transfer automatically.
          NOTES

          gh release create "android-$VERSION_CODE" release-output/* \
            --target "$GITHUB_SHA" \
            --title "MEW HARVEST $VERSION_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            --draft

      - name: Remove signing key from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mew-release.jks"
